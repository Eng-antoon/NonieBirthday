<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Nonie!</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hero Section -->
    <header class="hero-section">
        <canvas id="particles-canvas"></canvas>
        <div class="hero-content">
            <h1 class="hero-title">Happy Birthday, Nonie!</h1>
            <p class="hero-subtitle">Every moment with you is a gift, my beautiful Marnona.</p>
        </div>
    </header>

    <!-- Image Gallery Section -->
    <main class="gallery-section">
        <h2 class="section-title">Beautiful Memories with Nonie 📸</h2>
        <div id="image-gallery-container" class="gallery-slideshow">
            <!-- Image gallery will be dynamically generated by JavaScript -->
        </div>
    </main>

    <!-- Video Gallery Section -->
    <section class="video-gallery-section">
        <h2 class="section-title">Special Video Messages for Nonie 🎬</h2>
        <div id="video-gallery-container" class="gallery-slideshow">
            <!-- Video gallery will be dynamically generated by JavaScript -->
        </div>
    </section>

    <!-- YouTube Message Section -->
    <section class="youtube-section">
        <h2 class="section-title">A Special Message Just For You, Nonie</h2>
        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="A Special Message"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </section>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Scripts -->
    <script src="firebase-config.js" defer></script>
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
